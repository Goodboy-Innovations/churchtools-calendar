{# ChurchTools calendar. module.js / module.css are generated by `npm run build:hubspot`. #}
{% set ct_container_id = "churchtools-calendar-" ~ name|md5 %}
{% set ct_language = module.language if module.language != "auto" else "" %}

<div id="{{ ct_container_id }}"
     class="churchtools-calendar-container{% if module.lahden_vapis_theme %} ct-theme-lahden-vapis{% endif %}"></div>

<script>
  (function () {
    function start() {
      window.ChurchToolsCalendar.init(
        {{ ct_container_id|tojson }},
        {{ module.base_url|tojson }},
        {{ module.calendar_id|tojson }},
        "calendar",
        {{ ct_language|tojson }}
      );
    }
    // module.js is loaded in the page footer, so wait for it
    if (window.ChurchToolsCalendar) {
      start();
    } else if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      window.addEventListener('load', start);
    }
  })();
</script>
